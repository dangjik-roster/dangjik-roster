name: 근무표 안드로이드 앱 빌드
on:
  push:
    branches: [ android ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 안드로이드 SDK 준비
        run: |
          echo "::notice::기존 ANDROID_HOME=${ANDROID_HOME:-없음} / $(ls ${ANDROID_HOME:-/nonexistent} 2>/dev/null | tr '\n' ' ')"
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME=$HOME/android-sdk; mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSLo /tmp/t.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip || { echo "::error::SDK 도구 다운로드 실패"; exit 1; }
            unzip -q /tmp/t.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV; echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
      - name: 시험용 APK (휴대폰에 바로 설치)
        working-directory: android
        env: { APP_VERSION_CODE: "${{ github.run_number }}" }
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || { { grep -B2 -A12 "What went wrong" build.log; grep -iE "^e:|error:" build.log; } | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: 시험용-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: 시험용 APK를 공개 다운로드 링크로 올리기
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dangjik-roster.apk
          gh release view app >/dev/null 2>&1 || gh release create app --prerelease --target android --title "당직 근무표 앱 (APK)" --notes "안드로이드 휴대폰에서 받아 설치하는 근무표 앱입니다. 스토어 출시용이 아닙니다."
          gh release upload app dangjik-roster.apk --clobber
